name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the gh-pages branch, which Pages serves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Repo secret holding the Mapbox public token (pk.*). Without it the page asks for a token at runtime.
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
